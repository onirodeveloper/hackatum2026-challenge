<?xml version="1.0" encoding="UTF-8"?>
<svg width="360px" height="780px" viewBox="0 0 360 780" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Hackathon Conductor Template Preview</title>
    <desc>An unbranded hackathon heading with poster lettering and a yellow underline above a stylized locomotive.</desc>

    <rect width="360" height="780" fill="#101014"/>
    <rect x="0" y="0" width="360" height="12" fill="#25B5BB"/>

    <!-- Outlined poster lettering keeps the heading independent of installed fonts. -->
    <g id="hackathon-heading" transform="translate(24 42)" role="img" aria-label="Hackathon">
        <g fill="#FFFBEF" fill-rule="evenodd">
            <!-- HACK -->
            <path transform="translate(10 0) scale(1.066667 0.90625)" d="M1 2 L20 1 L20 25 L40 23 L41 1 L59 0 L60 63 L41 64 L40 40 L20 41 L20 63 L0 64 Z"/>
            <path transform="translate(82 0) scale(1.066667 0.90625)" d="M17 1 L43 0 L60 64 L41 64 L38 51 L21 52 L18 64 L0 64 Z M25 37 L35 37 L30 17 Z"/>
            <path transform="translate(154 0) scale(1.066667 0.90625)" d="M13 1 L47 0 L59 10 L59 24 L41 25 L41 16 L20 17 L20 47 L41 48 L41 39 L60 38 L60 53 L48 64 L12 64 L1 53 L0 12 Z"/>
            <path transform="translate(226 0) scale(1.066667 0.90625)" d="M1 1 L20 0 L20 24 L39 1 L60 0 L36 31 L60 64 L38 64 L20 41 L20 63 L0 64 Z"/>
            <!-- ATHON -->
            <path transform="translate(0 64) scale(0.866667 0.90625)" d="M17 1 L43 0 L60 64 L41 64 L38 51 L21 52 L18 64 L0 64 Z M25 37 L35 37 L30 17 Z"/>
            <path transform="translate(62 64) scale(0.866667 0.90625)" d="M0 1 L60 0 L59 17 L40 18 L40 63 L20 64 L19 18 L1 19 Z"/>
            <path transform="translate(124 64) scale(0.866667 0.90625)" d="M1 2 L20 1 L20 25 L40 23 L41 1 L59 0 L60 63 L41 64 L40 40 L20 41 L20 63 L0 64 Z"/>
            <path transform="translate(186 64) scale(0.866667 0.90625)" d="M12 1 L47 0 L59 11 L60 52 L48 64 L12 64 L0 53 L1 12 Z M20 17 L20 47 L40 47 L40 16 Z"/>
            <path transform="translate(248 64) scale(0.866667 0.90625)" d="M1 1 L19 0 L41 34 L40 1 L59 0 L60 63 L42 64 L19 30 L20 63 L0 64 Z"/>
        </g>
        <path d="M4 133 C43 129 78 134 112 131 C151 129 181 132 216 131 C246 130 271 130 296 132 M2 136 C48 132 87 134 127 133 C172 131 210 134 249 132 L295 133" fill="none" stroke="#FFF36A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="template-label" transform="translate(24 206)">
        <rect width="200" height="30" rx="15" fill="none" stroke="#5B5B64"/>
        <circle cx="15" cy="14.5" r="4" fill="#E4087E"/>
        <text x="28" y="19" fill="#D8D8DE" font-family="Huawei Sans, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">CONDUCTOR TEMPLATE</text>
    </g>

    <g id="locomotive" transform="translate(0 449)">
        <path d="M16 266 H344" stroke="#292930" stroke-width="2"/>
        <path d="M24 319 L107 266 M91 319 L161 266 M160 319 L214 266 M235 319 L271 266 M310 319 L329 266" stroke="#5B5B64" stroke-width="5"/>
        <path d="M16 293 H344 M16 319 H344" stroke="#25B5BB" stroke-width="5"/>

        <g transform="translate(24 31)">
            <!-- exhaust stack and angular cab roof -->
            <path d="M166 74 V45 H191 V74" fill="#24252C" stroke="#858791" stroke-width="3"/>
            <path d="M157 45 H200" stroke="#25B5BB" stroke-width="5"/>
            <path d="M15 42 L34 25 H116 L132 42 V104 H15Z" fill="#555762" stroke="#BFC1C8" stroke-width="3"/>
            <path d="M8 42 H137" stroke="#E4087E" stroke-width="6"/>

            <!-- armored windows -->
            <path d="M35 50 H72 V87 H31Z M82 50 H115 L120 87 H82Z" fill="#111218" stroke="#25B5BB" stroke-width="3"/>
            <path d="M37 55 L66 55 M87 55 L110 55" stroke="#5B5B64" stroke-width="3"/>

            <!-- long engine hood and sloped nose -->
            <path d="M16 103 H224 L253 122 L274 181 V202 H8 V127Z" fill="#454750" stroke="#BFC1C8" stroke-width="3"/>
            <path d="M132 77 H223 V103 H132Z" fill="#60626D" stroke="#BFC1C8" stroke-width="3"/>
            <path d="M223 103 L253 122 L266 157 H223Z" fill="#34363E"/>
            <path d="M16 113 H222" stroke="#E4087E" stroke-width="8"/>
            <path d="M222 113 L250 130" stroke="#25B5BB" stroke-width="8"/>

            <!-- engine vents, access panels, and rivets -->
            <path d="M148 88 V101 M158 88 V101 M168 88 V101 M178 88 V101 M188 88 V101 M198 88 V101 M208 88 V101" stroke="#1B1C22" stroke-width="5"/>
            <rect x="50" y="129" width="67" height="49" fill="#363840" stroke="#747680" stroke-width="2"/>
            <path d="M58 140 H108 M58 150 H108 M58 160 H108 M58 170 H108" stroke="#25262D" stroke-width="5"/>
            <rect x="129" y="129" width="65" height="49" fill="#3B3D46" stroke="#747680" stroke-width="2"/>
            <path d="M142 139 V169 M154 139 V169 M166 139 V169 M178 139 V169" stroke="#24252C" stroke-width="6"/>
            <g fill="#BFC1C8">
                <circle cx="23" cy="121" r="2.5"/><circle cx="23" cy="187" r="2.5"/>
                <circle cx="214" cy="121" r="2.5"/><circle cx="214" cy="187" r="2.5"/>
                <circle cx="239" cy="133" r="2.5"/><circle cx="258" cy="181" r="2.5"/>
            </g>

            <!-- handrail, headlamp, and striped front buffer -->
            <path d="M202 91 H242 L262 109 V151" fill="none" stroke="#D8D9DE" stroke-width="3"/>
            <circle cx="245" cy="139" r="10" fill="#F8C848" stroke="#101014" stroke-width="4"/>
            <path d="M250 167 H279 V204 H261Z" fill="#F8C848"/>
            <path d="M252 171 L276 195 M248 185 L268 205" stroke="#101014" stroke-width="8"/>

            <!-- heavy underframe -->
            <path d="M0 190 H282 V212 H0Z" fill="#1B1C22"/>
            <path d="M8 190 H274" stroke="#E4087E" stroke-width="5"/>
            <path d="M16 212 H264" stroke="#777985" stroke-width="7"/>
            <path d="M-8 200 H8 M282 200 H303" stroke="#BFC1C8" stroke-width="8"/>
            <rect x="299" y="193" width="13" height="14" fill="#25262D" stroke="#BFC1C8" stroke-width="3"/>

            <!-- three-wheel industrial bogie and connecting rod -->
            <g fill="#111218" stroke="#777985" stroke-width="7">
                <circle cx="50" cy="218" r="27"/>
                <circle cx="137" cy="218" r="27"/>
                <circle cx="224" cy="218" r="27"/>
            </g>
            <g fill="#D8D9DE" stroke="#25B5BB" stroke-width="5">
                <circle cx="50" cy="218" r="10"/>
                <circle cx="137" cy="218" r="10"/>
                <circle cx="224" cy="218" r="10"/>
            </g>
            <path d="M50 218 L137 205 L224 218" fill="none" stroke="#E4087E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="137" cy="205" r="5" fill="#F8C848"/>
        </g>

        <path d="M16 59 H68 M290 33 H344 M307 58 H344" stroke="#5B5B64" stroke-width="4" stroke-linecap="round"/>
        <path d="M186 53 C177 42 178 31 190 21 M204 49 C198 37 201 24 214 15" fill="none" stroke="#5B5B64" stroke-width="4" stroke-linecap="round"/>
        <circle cx="329" cy="105" r="7" fill="#E4087E"/>
        <circle cx="13" cy="151" r="5" fill="#25B5BB"/>
    </g>
</svg>
